# Build the release artefacts and publish them, so that install.sh can fetch a
# verified binary instead of asking somebody to build Go on a Raspberry Pi.
#
# The names here are a CONTRACT with install.sh and must not drift:
#
#   caspian-linux-amd64   from uname -m = x86_64
#   caspian-linux-arm64   from uname -m = aarch64
#   caspian-linux-arm     from uname -m = armv7l AND armv6l
#   SHA256SUMS            the file install.sh verifies every artefact against
#
# GOARM=6 ON THE 32-BIT BUILD IS LOAD-BEARING. detect_arch in install.sh maps
# both armv7l and armv6l onto the single "arm" artefact, and says in its own
# comment that this is only correct while that artefact is built for ARMv6.
# Building it GOARM=7 puts back a bug this project has already had once: the
# binary installs cleanly on a Pi 1, a Pi Zero or a Pi Zero W and then dies with
# an illegal instruction the first time it runs, because ARM1176 does not have
# the instructions ARMv7 code emits.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The gate runs first and the release depends on it, so a tag cannot publish
    # a binary that does not pass. scripts/gate.sh exits non-zero on failure and
    # is not piped anywhere, because a pipeline reports the status of its last
    # command and would throw that answer away.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: Run the build gate
        run: bash scripts/gate.sh

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build every artefact
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X caspianbyoc.org/caspian/internal/panel.Version=${GITHUB_REF_NAME}"
          # -trimpath so the binary carries no build-machine paths, and
          # -buildvcs=false so it carries no commit metadata either. Neither is
          # cosmetic: this is censorship-circumvention software and a path or a
          # revision baked into a shipped binary is information about whoever
          # built it.
          GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false -ldflags "$ldflags" -o dist/caspian-linux-amd64 ./cmd/caspian
          GOOS=linux GOARCH=arm64 \
            go build -trimpath -buildvcs=false -ldflags "$ldflags" -o dist/caspian-linux-arm64 ./cmd/caspian
          GOOS=linux GOARCH=arm GOARM=6 \
            go build -trimpath -buildvcs=false -ldflags "$ldflags" -o dist/caspian-linux-arm ./cmd/caspian

      - name: Prove the 32-bit build really is ARMv6
        run: |
          set -eu
          # If this ever reports ARMv7, install.sh's armv6l row is wrong and Pi
          # Zero users get a binary that dies on first run. Fail here instead.
          #
          # The arm64 artefact is passed as a negative control, so the run also
          # proves the check can still reject something. The version of this step
          # it replaces read "readelf -A", which Go never emits, so it could not
          # pass for any input. See the header of the script for the measurements.
          bash scripts/check-armv6.sh dist/caspian-linux-arm dist/caspian-linux-arm64

      - name: Keep Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/caspian-linux-*

  windows:
    needs: gate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install the installer compiler
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build the Windows installer
        shell: powershell
        run: .\packaging\windows\installer\build-installer.ps1 -Version "${{ github.ref_name }}" -Architecture "${{ matrix.architecture }}"
      - name: Keep the Windows release file
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-release
          path: out/installer/CaspianSetup-*-windows-${{ matrix.architecture }}.exe

  darwin:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: amd64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: Build the macOS DMG
        run: bash packaging/darwin/build-dmg.sh "${{ github.ref_name }}" "${{ matrix.architecture }}"
      - name: Keep the macOS release file
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.architecture }}-release
          path: dist/Caspian-*-macos-${{ matrix.architecture }}.dmg

  publish:
    needs: [build, windows, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum caspian-linux-* CaspianSetup-*-windows-*.exe Caspian-*-macos-*.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
