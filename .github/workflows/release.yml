# Build the release artefacts and publish them, so that install.sh can fetch a
# verified binary instead of asking somebody to build Go on a Raspberry Pi.
#
# The names here are a CONTRACT with install.sh and must not drift:
#
#   caspian-linux-amd64   from uname -m = x86_64
#   caspian-linux-arm64   from uname -m = aarch64
#   caspian-linux-arm     from uname -m = armv7l AND armv6l
#   SHA256SUMS            the file install.sh verifies every artefact against
#
# GOARM=6 ON THE 32-BIT BUILD IS LOAD-BEARING. detect_arch in install.sh maps
# both armv7l and armv6l onto the single "arm" artefact, and says in its own
# comment that this is only correct while that artefact is built for ARMv6.
# Building it GOARM=7 puts back a bug this project has already had once: the
# binary installs cleanly on a Pi 1, a Pi Zero or a Pi Zero W and then dies with
# an illegal instruction the first time it runs, because ARM1176 does not have
# the instructions ARMv7 code emits.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    # The gate runs first and the release depends on it, so a tag cannot publish
    # a binary that does not pass. scripts/gate.sh exits non-zero on failure and
    # is not piped anywhere, because a pipeline reports the status of its last
    # command and would throw that answer away.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: Run the build gate
        run: bash scripts/gate.sh

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build every artefact
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          # -trimpath so the binary carries no build-machine paths, and
          # -buildvcs=false so it carries no commit metadata either. Neither is
          # cosmetic: this is censorship-circumvention software and a path or a
          # revision baked into a shipped binary is information about whoever
          # built it.
          GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/caspian-linux-amd64 ./cmd/caspian
          GOOS=linux GOARCH=arm64 \
            go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/caspian-linux-arm64 ./cmd/caspian
          GOOS=linux GOARCH=arm GOARM=6 \
            go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/caspian-linux-arm ./cmd/caspian

      - name: Prove the 32-bit build really is ARMv6
        run: |
          set -eu
          # If this ever reports ARMv7, install.sh's armv6l row is wrong and Pi
          # Zero users get a binary that dies on first run. Fail here instead.
          readelf -A dist/caspian-linux-arm | grep -q 'Tag_CPU_arch: v6' || {
            echo "the 32-bit artefact is not ARMv6. install.sh maps armv6l onto it." >&2
            readelf -A dist/caspian-linux-arm | head -20 >&2
            exit 1
          }
          echo "confirmed ARMv6"

      - name: Checksums
        run: |
          set -eu
          cd dist
          # Plain sha256sum format, one file, named SHA256SUMS, because that is
          # what CASPIAN_CHECKSUMS_NAME defaults to in install.sh.
          sha256sum caspian-linux-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/caspian-linux-amd64
            dist/caspian-linux-arm64
            dist/caspian-linux-arm
            dist/SHA256SUMS
          generate_release_notes: true
