# Publish a container image to GitHub Packages on every release tag.
#
# This exists so the project appears under Packages and so somebody can try the
# panel without installing anything on a real machine. It is NOT the supported
# way to run the appliance, and the image says so: the whole product is about
# taking over a machine's radio, routes and firewall, and a container cannot do
# that without privileges that defeat the point of a container.
#
# What the image is good for: reading the panel, seeing the interface, checking
# the binary runs. What it cannot do: host an access point.
name: package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Container registries require a lowercase repository name and
      # github.repository carries the owner's capitalisation, so
      # ghcr.io/Iman/caspian is rejected outright with "repository name must be
      # lowercase". Compute it once rather than hardcoding, so a rename or a
      # transfer to an organisation does not silently break this again.
      - name: Lowercase the image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.img.outputs.name }}:latest
          provenance: true
          sbom: true
